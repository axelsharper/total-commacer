name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bin: total-commacer
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            bin: total-commacer
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            bin: total-commacer
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            bin: total-commacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
        # the Intel build is cross-compiled on the Apple Silicon runner; its tests run under Rosetta
      - uses: actions/upload-artifact@v4
        with:
          name: total-commacer-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  # A pushed tag v* turns the four binaries into a GitHub Release with download links.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          set -e
          V=${VERSION}
          mkdir dist
          chmod +x artifacts/total-commacer-linux-x86_64/total-commacer artifacts/total-commacer-macos-*/total-commacer
          tar -C artifacts/total-commacer-linux-x86_64 -czf dist/total-commacer-$V-linux-x86_64.tar.gz total-commacer
          (cd artifacts/total-commacer-macos-arm64 && zip -q ../../dist/total-commacer-$V-macos-arm64.zip total-commacer)
          (cd artifacts/total-commacer-macos-x86_64 && zip -q ../../dist/total-commacer-$V-macos-x86_64.zip total-commacer)
          (cd artifacts/total-commacer-windows-x86_64 && zip -q ../../dist/total-commacer-$V-windows-x86_64.zip total-commacer.exe)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
          body: |
            Unsigned builds. Windows: SmartScreen → "More info" → "Run anyway".
            macOS: `xattr -d com.apple.quarantine total-commacer` once, then run it.
            Settings live in `~/.config/total-commacer/wincmd.ini` (`%APPDATA%\total-commacer\wincmd.ini` on Windows).
