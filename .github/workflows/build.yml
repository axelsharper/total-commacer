name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bin: total-commacer
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            bin: total-commacer
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            bin: total-commacer
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            bin: total-commacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
        # the Intel build is cross-compiled on the Apple Silicon runner; its tests run under Rosetta
      - uses: actions/upload-artifact@v4
        with:
          name: total-commacer-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
