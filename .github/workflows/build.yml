name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: total-commacer
          - os: macos-latest
            name: macos-arm64
            bin: total-commacer
          - os: macos-13
            name: macos-x86_64
            bin: total-commacer
          - os: windows-latest
            name: windows-x86_64
            bin: total-commacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: total-commacer-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
